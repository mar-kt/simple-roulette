<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .wheel-base { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .spoke-main { stroke: #94a3b8; stroke-width: 1.6; stroke-linecap: round; }
      .spoke-sec { stroke: #475569; stroke-width: 1.2; stroke-linecap: round; }
      .center-core { fill: #ffffff; }
      .center-dot { fill: #0f172a; }
      .pointer { fill: #38bdf8; }
      @media (prefers-color-scheme: dark) {
        .wheel-base { fill: #020617; stroke: #475569; }
        .pointer { fill: #38bdf8; }
      }
    </style>
  </defs>

  <!-- Disco exterior -->
  <circle class="wheel-base" cx="16" cy="16" r="14.5" />

  <!-- Anillo guía interior -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Marcas cardinales de la ruleta -->
  <line class="spoke-main" x1="16" y1="3" x2="16" y2="7.5" />
  <line class="spoke-main" x1="16" y1="24.5" x2="16" y2="29" />
  <line class="spoke-main" x1="3" y1="16" x2="7.5" y2="16" />
  <line class="spoke-main" x1="24.5" y1="16" x2="29" y2="16" />

  <!-- Marcas diagonales -->
  <line class="spoke-sec" x1="6.8" y1="6.8" x2="10" y2="10" />
  <line class="spoke-sec" x1="22" y1="22" x2="25.2" y2="25.2" />
  <line class="spoke-sec" x1="25.2" y1="6.8" x2="22" y2="10" />
  <line class="spoke-sec" x1="10" y1="22" x2="6.8" y2="25.2" />

  <!-- Centro y eje -->
  <circle class="center-core" cx="16" cy="16" r="3.8" />
  <circle class="center-dot" cx="16" cy="16" r="1.4" />

  <!-- Indicador / aguja minimalista superior -->
  <polygon class="pointer" points="16,11 12.8,3.2 19.2,3.2" />
</svg>
